name: Bazel Storybook in a Gitless container

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      # Git and its full history exist on the CI runner, not in the build container.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify full Git history is available
        run: test "$(git rev-parse --is-shallow-repository)" = "false"

      - uses: docker/setup-buildx-action@v3

      - name: Build Storybook with Bazel in the Gitless container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/bazel-gitless/Dockerfile
          target: artifact
          outputs: type=local,dest=./storybook-static

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.3

      - name: Verify exported Storybook
        run: node examples/bazel-gitless/verify-storybook.cjs storybook-static

      # Chromatic runs on the checkout-owning runner so baseline and TurboSnap
      # logic can use the real commit graph. It uploads the container-built output.
      - name: Publish prebuilt Storybook to Chromatic
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: >-
          npx --yes chromatic@18.0.1
          --storybook-build-dir=storybook-static
          --only-changed
