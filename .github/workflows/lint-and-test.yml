name: Lint and Test

on:
  push:
    branches:
      - main
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Runs before the build so it can't depend on generated output.
      - name: Dead code and dependency audit
        run: yarn knip

      # check types and linting issues
      - run: yarn typescript:check
      - run: yarn lint

      # test if dist is correctly generated from src
      - run: yarn build && git status --porcelain

      # unit test
      - run: yarn test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
