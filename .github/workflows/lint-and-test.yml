name: Lint and Test

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: E2E fixture Storybook versions
        run: node e2e/check-storybook-versions.mjs

      # Runs before the build so it can't depend on generated output. The production run leaves out
      # tests, stories, and frames, so it fails on an export only they use.
      - name: Dead code and dependency audit
        run: yarn knip && yarn knip --production

      # check types and linting issues
      - run: yarn typescript:check
      - run: yarn lint

      # test if dist is correctly generated from src
      - run: yarn build && git status --porcelain

      # Consumers that typecheck node_modules (skipLibCheck: false) must be able to load chromatic/node's types.
      - run: yarn typescript:check-declarations

      # unit test
      - run: yarn test
