name: Smoke test via action next
on: merge_group

permissions:
  contents: read

jobs:
  smoke-test-action-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Push to action-next
        id: publish
        run: yarn run release-next
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Build and pack the CLI
        run: |
          yarn build
          yarn pack --out chromatic.tgz
      - name: Copy fixture outside the repo
        # We copy the fixture outside the repo so the test can stand alone without falling back to the repo's node_modules
        run: |
          cp -r smoke-tests "$RUNNER_TEMP/smoke-tests"
          cp chromatic.tgz "$RUNNER_TEMP/chromatic.tgz"
          git -C "$RUNNER_TEMP/smoke-tests" init --quiet
          git -C "$RUNNER_TEMP/smoke-tests" config user.email smoke@chromatic.com
          git -C "$RUNNER_TEMP/smoke-tests" config user.name "Smoke Test"

          git -C "$RUNNER_TEMP/smoke-tests" add -A
          git -C "$RUNNER_TEMP/smoke-tests" commit --quiet -m "Smoke test fixture"
          git -C "$RUNNER_TEMP/smoke-tests" commit --quiet --allow-empty -m "Second commit so Chromatic can find a baseline"
      - name: Install fixture deps
        working-directory: ${{ runner.temp }}/smoke-tests
        run: |
          corepack enable
          corepack use yarn@4.2.2
          yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
      # `uses:` doesn't accept expressions, so check out this run's pinned tag and run it locally.
      # GitHub documents this checkout-then-`uses: ./path` pattern for actions in private repos.
      # action-next is public, so the default token is enough:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#example-using-an-action-inside-a-different-private-repository-than-the-workflow
      - name: Check out the published action
        uses: actions/checkout@v7
        with:
          repository: chromaui/action-next
          ref: ${{ steps.publish.outputs.tag }}
          path: action-next
          persist-credentials: false
      # This looks odd, but it keeps the smoke test honest. The action bundle leaves `semver` external
      # and ships it in action-next's own node_modules. Because action-next is checked out inside
      # this workspace, Node would fall back to the workspace's node_modules (from the CLI's own
      # install) if that copy were missing, so a broken publish would still pass. Moving the
      # workspace node_modules away makes the action resolve dependencies only from what was
      # published, as it does for users.
      - name: Hide workspace node_modules from the action
        run: mv node_modules "$RUNNER_TEMP/workspace-node_modules"
      - name: Run build against action-next
        uses: ./action-next
        with:
          workingDir: ${{ runner.temp }}/smoke-tests
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          forceRebuild: true
        env:
          LOG_LEVEL: debug
          DEBUG: chromatic-cli
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.SMOKE_TESTS_CHROMATIC_PROJECT_TOKEN }}
      # Move node_modules back so the setup action's cache step doesn't save a cache without it.
      # It saves whatever paths still exist, which would leave only .yarn/install-state.gz.
      - name: Restore workspace node_modules
        if: always()
        run: '[ ! -d "$RUNNER_TEMP/workspace-node_modules" ] || mv "$RUNNER_TEMP/workspace-node_modules" node_modules'
